plugins {
    id 'java-conventions'
    id 'spring-conventions'
    id 'common-dependencies'
}

jar {
    manifest.attributes("Main-Class": 'ru.clevertec.newsservice.NewsServiceApplication')
}

ext {
    openApiVersion = '2.7.0'
    junitVersion = '5.11.4'
}

dependencies {
    api project(':comment-service-core')

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openApiVersion}"

    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    //full text search
    implementation "org.hibernate.search:hibernate-search-mapper-orm:7.1.2.Final"
    implementation "org.hibernate.search:hibernate-search-backend-lucene:7.1.2.Final"

    testImplementation "org.wiremock:wiremock-standalone:3.9.2"
}

test {
    useJUnitPlatform()
}
