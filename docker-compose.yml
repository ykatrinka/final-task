version: "3.9"

services:

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "auth_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    container_name: auth-db
    expose:
      - "5433"
    ports:
      - "5433:5432"
    command: -p 5433
    networks:
      - news-system

  news-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "news_system"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    container_name: news-db
    ports:
      - "5432:5432"
    networks:
      - news-system

  cache-redis:
    image: redis:alpine
    restart: on-failure
    container_name: cache-redis
    ports:
      - "6379:6379"
    volumes:
      - cache:/data
    networks:
      - news-system

  auth-service:
    image: auth-service-image
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    restart: unless-stopped
    depends_on:
      - auth-db
    networks:
      - news-system

  news-service:
    image: news-service-image
    container_name: news-service
    build:
      context: ./news-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      - news-db
    networks:
      - news-system

  comment-service:
    image: comment-service-image
    container_name: comment-service
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      - news-db
      - news-service
    networks:
      - news-system

networks:
  news-system:
    driver: bridge

volumes:
  cache:
