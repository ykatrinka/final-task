version: "3.9"

services:

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "auth_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    container_name: auth-db
    expose:
      - "5433"
    ports:
      - "5433:5432"
    command: -p 5433
    networks:
      - news-system

  auth-service:
    image: auth-service-image
    container_name: auth-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    restart: unless-stopped
    depends_on:
      - auth-db
    networks:
      - news-system

networks:
  news-system:
    driver: bridge
